$kind: http-request
description: >-
  Lists all subscribers for a product. Supports cursor-based pagination via
  `page_token`.


  The test script automatically stores `next_page_token` in the environment for
  chained pagination.


  All optional query params are included as disabled entries — enable them as
  needed.
url: "{{base_url}}/payments/api/v1/subscription/subscribers?product_id={{produc\
  t_id}}&max_results=50"
method: GET
queryParams:
  - key: product_id
    value: "{{product_id}}"
    description: 7-digit mentorship product ID.
  - key: max_results
    value: "50"
    description: Items per page.
  - key: page_token
    value: "{{next_page_token}}"
    disabled: true
    description: Pagination cursor from previous response. Leave empty for first page.
  - key: status
    value: ACTIVE
    disabled: true
    description: "Filter by status. Options: ACTIVE, INACTIVE, OVERDUE,
      CANCELLED_BY_CUSTOMER, CANCELLED_BY_SELLER, CANCELLED_BY_ADMIN, STARTED,
      DELAYED"
  - key: subscriber_email
    value: ""
    disabled: true
    description: Filter by subscriber email.
  - key: subscriber_code
    value: ""
    disabled: true
    description: Filter by subscriber code.
  - key: plan_name
    value: ""
    disabled: true
    description: Filter by plan name. Repeatable for multiple values.
  - key: plan_id
    value: ""
    disabled: true
    description: Filter by plan ID.
  - key: trial
    value: "false"
    disabled: true
    description: Filter to subscriptions with (true) or without (false) a trial period.
  - key: transaction
    value: ""
    disabled: true
    description: Filter by transaction ID (e.g. HP17715690036014).
  - key: accession_date
    value: ""
    disabled: true
    description: Filter subscriptions from this date (ms since epoch).
  - key: cancellation_date
    value: ""
    disabled: true
    description: Filter by cancellation date (ms since epoch).
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status 200', () => pm.response.to.have.status(200));


      if (pm.response.code === 200) {
          const body = pm.response.json();
          pm.test('Has items', () => pm.expect(body.items).to.be.an('array'));

          // Store next page token if present
          if (body.page_info && body.page_info.next_page_token) {
              pm.environment.set('next_page_token', body.page_info.next_page_token);
              console.log('Next page token stored:', body.page_info.next_page_token);
          } else {
              pm.environment.unset('next_page_token');
              console.log('Last page reached.');
          }

          console.log('Items on page:', body.items.length);
          console.log('Total results:', body.page_info && body.page_info.total_results);
      }
    language: text/javascript
order: 2000
